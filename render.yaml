services:
  # 1. FastAPI Authoritative Evaluation & Provenance Web Service
  - type: web
    name: orbitscore-api
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && pip install -e ../ai_ml"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /ready
    disk:
      name: orbitscore-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: ORBIT_ENV
        value: production
      - key: ORBITSCORE_AUTH_ENABLED
        value: "1"
      - key: ORBITSCORE_REVIEWER_KEY
        value: "orbit_reviewer_secret_token"
      - key: ORBITSCORE_VIEWER_KEY
        value: "orbit_viewer_secret_token"
      - key: ORBITSCORE_CORS_ORIGINS
        value: "https://orbitscore-web.onrender.com"
      - key: AGENT37_ENABLED
        value: "1"
      - key: AGENT37_INSTANCE_ID
        value: "z2dhn46l7d"
      - key: AGENT37_INSTANCE_URL
        value: "https://z2dhn46l7d.agent37.app"
      - key: AGENT37_API_KEY
        sync: false
      - key: BROWSER_USE_ENABLED
        value: "0"
      - key: BROWSER_USE_API_KEY
        sync: false
      - key: ELEVENLABS_ENABLED
        value: "0"
      - key: XI_API_KEY
        sync: false

  # 2. Canonical React/Vite Reviewer Console Static Site
  - type: web
    name: orbitscore-web
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://orbitscore-api.onrender.com"

  # 3. Render Background Worker & Workflow Task
  # Qualifies for Hackyard's 'Best Use of Render' prize track by executing
  # idempotent background source audits and integrity maintenance.
  - type: worker
    name: orbitscore-worker
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && pip install -e ../ai_ml"
    startCommand: "python -m app.worker"
    disk:
      name: orbitscore-worker-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: ORBIT_ENV
        value: production
      - key: ORBITSCORE_AUTH_ENABLED
        value: "0"
