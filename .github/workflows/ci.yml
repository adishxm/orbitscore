name: OrbitScore CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-and-ml:
    name: Backend & AI/ML Automated Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov anyio

      - name: Run Backend Pytest Suite (64 tests)
        run: |
          python -m pytest backend/tests/ -v

      - name: Run AI/ML Pytest Suite (33 tests)
        run: |
          python -m pytest ai_ml/tests/ -v

  frontend:
    name: Frontend Verification & Axe Accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest Suite (85 tests, Axe A11y & Banned Words Lint)
        run: |
          cd frontend
          npm test
